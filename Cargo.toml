[package]
authors.workspace = true
categories = ["config", "command-line-utilities", "development-tools"]
description = "The MeshX CLI (meshx) for developing and deploying Wasm components"
edition.workspace = true
keywords = ["webassembly", "wasm", "component-model", "meshx", "cli"]
license.workspace = true
name = "meshx"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[workspace]
members = [
  "crates/meshx-client",
]
package.authors = ["The MeshX Team"]
package.edition = "2024"
package.license = "Apache-2.0"
package.repository = "https://github.com/meshx-org/meshx"
package.rust-version = "1.92.0"
package.version = "0.1.0"
resolver = "2"

[lib]
name = "meshx"
path = "crates/meshx/src/lib.rs"

[[bin]]
name = "meshx"
path = "src/main.rs"

[badges]
maintenance = {status = "actively-developed"}

[dependencies]
anyhow = {workspace = true}
fiber-authz-cedar = {workspace = true}
fiber-data = {workspace = true}
clap = {workspace = true, features = ["derive", "env", "help", "color", "suggestions", "wrap_help", "cargo", "string"]}
clap-markdown = {workspace = true}
clap_complete = {workspace = true}
ctrlc = {workspace = true}
dialoguer = {workspace = true, features = ["editor", "password", "zeroize", "fuzzy-select", "fuzzy-matcher"]}
etcetera = {workspace = true}
figment = {workspace = true, features = ["json", "env", "yaml", "toml"]}
flate2 = {workspace = true}
http-server = {workspace = true}
meshx_client = {path = "./crates/meshx-client", default-features = false, features = ["rustls-tls"]}
notify = {workspace = true}
oneshot = {workspace = true}
reqwest = {workspace = true, features = ["json", "rustls-tls"]}
semver = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true, features = ["std"]}
serde_yaml = {workspace = true}
serde_yaml_ng = {workspace = true}
tar = {workspace = true}
tempfile = {workspace = true}
tokio = {workspace = true, features = ["full"]}
tracing = {workspace = true, features = ["attributes"]}
tracing-subscriber = {workspace = true, features = ["env-filter", "ansi", "time", "json"]}
url = {workspace = true}
uuid = {workspace = true}
wash-runtime = {workspace = true, features = ["washlet", "oci", "wasi-config", "wasi-logging", "wasi-blobstore", "wasi-keyvalue"]}
wasm-pkg-client = {workspace = true}
wasm-pkg-core = {workspace = true}
which = {workspace = true}

# Enable WebGPU support on non-Windows platforms
# WebGPU is disabled on Windows due to dependency version conflicts with the windows crate
[target.'cfg(not(target_os = "windows"))'.dependencies]
wash-runtime = {workspace = true, features = ["wasi-webgpu"]}

[workspace.dependencies]
anyhow = {version = "1", default-features = false}
async-trait = {version = "0.1", default-features = false}
clap = {version = "4.5", default-features = false, features = ["std", "derive", "env", "help", "color", "suggestions", "wrap_help", "cargo", "string"]}
clap-markdown = {version = "0.1", default-features = false}
clap_complete = {version = "4.5", default-features = false}
ctrlc = {version = "3.4", default-features = false}
dialoguer = {version = "0.11", default-features = false, features = ["editor", "password", "zeroize", "fuzzy-select", "fuzzy-matcher"]}
etcetera = {version = "0.10", default-features = false}
fiber-authz-cedar = {git = "https://github.com/meshx-org/fiber.git", branch = "main"}
fiber-data = {git = "https://github.com/meshx-org/fiber.git", branch = "main"}
figment = {version = "0.10", default-features = false}
flate2 = {version = "1.1", default-features = false}
http-server = {git = "https://github.com/meshx-org/fiber.git", branch = "main"}
notify = "8.2"
oci = "0.1"
oneshot = "0.1"
reqwest = {version = "0.12", default-features = false, features = ["json", "rustls-tls"]}
semver = {version = "1", default-features = false}
serde = {version = "1", default-features = false}
serde_json = {version = "1", default-features = false}
serde_yaml = {version = "0.9.34-deprecated", default-features = false}
serde_yaml_ng = {version = "0.9", default-features = false}
tar = {version = "0.4", default-features = false}
tempfile = {version = "3.24", default-features = false}
tokio = {version = "1.49", default-features = false, features = ["full"]}
tracing = {version = "0.1", default-features = false, features = ["attributes"]}
tracing-subscriber = {version = "0.3", default-features = false, features = ["env-filter", "ansi", "time", "json"]}
url = {version = "2.5", default-features = false}
uuid = {version = "1.19", default-features = false}
wash-runtime = {git = "https://github.com/wasmCloud/wash.git", branch = "main"}
wasm-pkg-client = {version = "0.13", default-features = false}
wasm-pkg-core = {version = "0.13", default-features = false}
wasmtime = {version = "38", default-features = false}
which = {version = "8", default-features = false, features = ["real-sys"]}

[workspace.metadata.cargo-machete]
ignored = [
  # Used in build.rs
  "pbjson",
  "pbjson-types",
  "serde", # Used for protos
  "tonic",
  "tonic-prost",
]

[package.metadata.binstall]
pkg-fmt = "bin"
pkg-url = "{ repo }/releases/download/{name}-v{version}/meshx-{ target }{ binary-ext }"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
