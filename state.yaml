apiVersion: meshx.co/v0
metadata:
  name: demo-app
  annotations:
    meshx.cloud/app: demo-app
workloads:
  - name: tables
    namespace: default
    components:
      - name: tables
        image: file://./examples/tables/target/wasm32-wasip2/release/tables.wasm
        poolSize: 10
        maxInvocations: 10
    hostInterfaces:
      - namespace: meshx
        package: data
        interfaces:
          - schema
        config:
  - name: http-authz
    namespace: default
    components:
      - name: http-authz
        image: file://./examples/http-authz/target/wasm32-wasip2/release/hello_authz.wasm
        poolSize: 10
        maxInvocations: 10
    hostInterfaces:
      - namespace: meshx
        package: data
        interfaces:
          - schema
        config:
      - namespace: wasi
        package: http
        interfaces:
          - incoming-handler
        config:
          host: 'localhost'
      - namespace: meshx
        package: authz
        interfaces:
          - engine
        config:
resources:
