[package]
authors = ["The MeshX Team"]
categories = ["meshx", "command-line-utilities"]
description = "The MeshX Shell (meshx) for developing and publishing Wasm components"
edition = "2024"
keywords = ["webassembly", "wasm", "component", "meshx", "cli"]
license = "Apache-2.0"
name = "meshx"
readme = "README.md"
repository = "https://github.com/meshx-org/meshx"
version = "0.0.1"

[workspace]
members = [
  #"crates/meshlet",
]
resolver = "2"

[lib]
name = "meshx"
path = "crates/meshx/src/lib.rs"

[[bin]]
name = "meshx"
path = "src/main.rs"

[badges]
maintenance = {status = "actively-developed"}

[dependencies]
anyhow = {workspace = true}
clap = {workspace = true, features = ["derive", "env", "help", "color", "suggestions", "wrap_help", "cargo", "string"]}
clap-markdown = {workspace = true}
clap_complete = {workspace = true}
ctrlc = {workspace = true}
dialoguer = {workspace = true, features = ["editor", "password", "zeroize", "fuzzy-select", "fuzzy-matcher"]}
etcetera = {workspace = true}
figment = {workspace = true, features = ["json", "env"]}
reqwest = {workspace = true, features = ["json", "rustls-tls"]}
semver = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true, features = ["std"]}
serde_yaml = {workspace = true}
tokio = {workspace = true, features = ["full"]}
tracing = {workspace = true, features = ["attributes"]}
tracing-subscriber = {workspace = true, features = ["env-filter", "ansi", "time", "json"]}
wash-runtime = {workspace = true, features = ["wasi-webgpu"]}

[workspace.dependencies]
anyhow = {version = "1.0.98", default-features = false}
clap = {version = "4.5.40", default-features = false, features = ["std", "derive", "env", "help", "color", "suggestions", "wrap_help", "cargo", "string"]}
clap-markdown = {version = "0.1.5", default-features = false}
clap_complete = {version = "4.5.40", default-features = false}
ctrlc = {version = "3.4.7", default-features = false}
dialoguer = {version = "0.11.0", default-features = false, features = ["editor", "password", "zeroize", "fuzzy-select", "fuzzy-matcher"]}
etcetera = {version = "0.10.0", default-features = false}
figment = {version = "0.10.19", default-features = false}
reqwest = {version = "0.12.20", default-features = false, features = ["json", "rustls-tls"]}
semver = {version = "1.0.26", default-features = false}
serde = {version = "1.0.219", default-features = false}
serde_json = {version = "1.0.140", default-features = false}
serde_yaml = {version = "0.9.34-deprecated", default-features = false}
tokio = {version = "1.45.1", default-features = false, features = ["full"]}
tracing = {version = "0.1.41", default-features = false, features = ["attributes"]}
tracing-subscriber = {version = "0.3.19", default-features = false, features = ["env-filter", "ansi", "time", "json"]}
wash-runtime = {git = "https://github.com/wasmCloud/wash.git", rev = "89c09ac"}

[package.metadata.binstall]
pkg-fmt = "bin"
pkg-url = "{ repo }/releases/download/{name}-v{version}/meshx-{ target }{ binary-ext }"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
