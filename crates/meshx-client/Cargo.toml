[package]
name = "meshx_client"
version = "0.0.1"
authors = ["hello@meshx.co"]
description = "MeshX Cloud API"
license = "Apache 2.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
reqwest = { version = "^0.12", default-features = false, features = ["json", "multipart"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-tls"]
